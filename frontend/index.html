<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0B0D" />
    <meta name="description" content="Discover thoughtfully sourced fashion, beauty, accessories and technology, delivered across Kenya and Tanzania by Habibi Infinity Imports." />
    <script>
      const savedTheme = localStorage.getItem('habibi-theme');
      document.documentElement.dataset.theme = savedTheme === 'dark' ? 'dark' : 'light';
      document.documentElement.style.colorScheme = savedTheme === 'dark' ? 'dark' : 'light';
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Permanent+Marker&family=Playfair+Display:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Habibi Infinity Imports</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
